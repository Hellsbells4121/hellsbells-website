backend:
  name: github
  repo: Hellsbells4121/hellsbells-website
  branch: main
  site_domain: hellsbells-au.netlify.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: "https://hellsbells4121.org"
display_url: "https://hellsbells4121.org"

collections:
  - name: "crochet"
    label: "Crochet Gallery"
    files:
      - file: "content/crochet.json"
        label: "Crochet Items"
        name: "crochet"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{name}} — {{status}}"
            collapsed: false
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Price", name: "price", widget: "string", required: false, hint: "Just the item price, like $10, then fill in the postage boxes below and the shop adds it. Or write $30 (postage included) for one price. Leave blank if not for sale."}
              - {label: "Status", name: "status", widget: "select", options: ["Available", "Made to order", "Sold", "In progress", "In collection"]}
              - {label: "Postage to Australia ($)", name: "postage_au", widget: "number", value_type: "float", min: 0, required: false, hint: "Type just the number, like 11.70. The shop adds it to the price."}
              - {label: "Postage to USA ($)", name: "postage_us", widget: "number", value_type: "float", min: 0, required: false, hint: "Type just the number, like 15.75. Leave blank if you do not post there."}
              - {label: "Postage to Canada ($)", name: "postage_ca", widget: "number", value_type: "float", min: 0, required: false, hint: "Type just the number, like 15.75. Australia Post charges Canada the same as the USA. Leave blank if you do not post there."}
              - {label: "Postage to Europe ($)", name: "postage_eu", widget: "number", value_type: "float", min: 0, required: false, hint: "Type just the number, like 16.60. Includes the UK. Leave blank if you do not post there."}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Photo", name: "image", widget: "image", required: false}

  - name: "music"
    label: "Music"
    files:
      - file: "content/music.json"
        label: "Albums"
        name: "music"
        fields:
          - label: "Albums"
            name: "albums"
            widget: "list"
            summary: "{{title}}"
            collapsed: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Cover art", name: "cover", widget: "image", required: false}
              - {label: "Spotify link", name: "spotify_url", widget: "string", required: false}
              - {label: "Apple Music link", name: "apple_music_url", widget: "string", required: false}
              - {label: "YouTube link", name: "youtube_url", widget: "string", required: false}

  - name: "books"
    label: "Books"
    files:
      - file: "content/books.json"
        label: "Books"
        name: "books"
        fields:
          - label: "Books"
            name: "books"
            widget: "list"
            summary: "{{title}}"
            collapsed: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Author or pen name", name: "author", widget: "string", required: false, hint: "Shown as 'by ...' under the title, like Briony Bramble or HPCreates. Leave blank to show no author."}
              - {label: "Description", name: "description", widget: "text", required: false}
              - {label: "Cover", name: "cover", widget: "image", required: false}
              - {label: "Amazon link", name: "amazon_url", widget: "string", required: false}
              - {label: "IngramSpark link", name: "ingramspark_url", widget: "string", required: false}
